<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Flow Money</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="app.css">
    <link rel="icon" type="image/png" href="flowmoneylogo.png">
</head>
<body class="auth-body">
    <div class="auth-card">
        <a href="index.html" class="auth-logo">
            <img src="flowmoneylogoblue.png" alt="Flow Money">
        </a>
        <h1>Bienvenido de nuevo</h1>
        <p class="auth-subtitle">Inicia sesión para intercambiar dinero simulado</p>

        <form id="loginForm" class="auth-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" autocomplete="username" required placeholder="evaluador1">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" autocomplete="current-password" required placeholder="••••••••">
            </div>
            <div class="auth-error" id="loginError"></div>
            <button type="submit" class="btn-primary-full" id="loginBtn">Iniciar sesión</button>
        </form>

        <div class="auth-demo-hint">
            <p><strong>Cuentas de demostración:</strong></p>
            <p>evaluador1…evaluador6 &nbsp;·&nbsp; contraseñas flow101…flow106</p>
        </div>

        <a href="index.html" class="auth-back">← Volver al inicio</a>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorBox = document.getElementById('loginError');
        const loginBtn = document.getElementById('loginBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorBox.textContent = '';
            loginBtn.disabled = true;
            loginBtn.textContent = 'Ingresando...';

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const json = await res.json();

                if (!res.ok) {
                    errorBox.textContent = json.error || 'Error al iniciar sesión';
                } else {
                    window.location.href = 'app.html';
                }
            } catch (err) {
                errorBox.textContent = 'No se pudo conectar con el servidor';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Iniciar sesión';
            }
        });
    </script>
</body>
</html>
